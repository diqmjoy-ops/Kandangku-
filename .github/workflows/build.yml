
name: Build KandangKu APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Pasang SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Ekstrak proyek
        run: unzip -o KandangKuAndroid_source.zip -d work

      - name: Bangun APK
        working-directory: work/KandangKuAndroid
        run: gradle assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: KandangKu-APK
          path: work/KandangKuAndroid/app/build/outputs/apk/debug/app-debug.apk
